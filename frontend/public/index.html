<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwelio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Qwelio</h1>
      <div class="header-status">
        <span id="calendar-status">Calendar: <em>not connected</em></span>
        <button id="logout-btn">Logout</button>
      </div>
    </header>

    <main>
      <section class="panel">
        <h2>Today</h2>
        <div id="today-events">
          <p class="placeholder">Loading today's events...</p>
        </div>
      </section>

      <section class="panel">
        <h2>This Week</h2>
        <div id="week-events">
          <p class="placeholder">Loading week's events...</p>
        </div>
      </section>

      <section class="panel chat-panel">
        <h2>Chat</h2>
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-form">
          <input type="text" id="chat-input" placeholder="Ask something..." autocomplete="off">
          <button type="submit">Send</button>
        </form>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
