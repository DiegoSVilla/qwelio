<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwelio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite">
    <div class="loading-spinner"></div>
    <p>Loading Qwelio...</p>
  </div>

  <div id="app-root" class="container app-hidden">
    <header>
      <h1>Qwelio</h1>
      <div class="header-status">
        <span id="calendar-status">Calendar: <em>not connected</em></span>
        <button id="logout-btn">Logout</button>
      </div>
    </header>

    <main class="dashboard">
      <div class="calendar-section">
        <section class="panel">
          <h2>Today</h2>
          <div id="today-events">
            <p class="placeholder">Loading today's events...</p>
          </div>
        </section>

        <section class="panel">
          <h2>This Week</h2>
          <div id="week-events">
            <p class="placeholder">Loading week's events...</p>
          </div>
        </section>
      </div>

      <aside class="chat-panel">
        <div class="panel">
          <h2>Chat</h2>
          <div id="chat-messages" class="chat-messages"></div>
          <form id="chat-form" class="chat-form">
            <input type="text" id="chat-input" placeholder="Ask something..." autocomplete="off">
            <button type="submit">Send</button>
          </form>
        </div>
      </aside>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
