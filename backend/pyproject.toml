[project]
name = "qwelio-backend"
version = "0.1.0"
description = "Qwelio AI assistant backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "python-dotenv",
]

[tool.ruff]
line-length = 100
target-version = "py312"
